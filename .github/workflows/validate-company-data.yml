name: 90 · Kontroll · AFR och digitala årsredovisningar
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/company_accounts/**
      - tests/test_company_accounts.py
      - .github/workflows/validate-company-data.yml
  push:
    branches: [feat/afr-history-annual-accounts]
    paths: [.github/workflows/validate-company-data.yml, scripts/company_accounts/**, tests/test_company_accounts.py, R/etl/afr_publication.R]
permissions:
  contents: read
jobs:
  contract:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verifiera verkliga källkontrakt utan personuppgifter
        env:
          SCB_AFR_API_KEY: ${{ secrets.SCB_AFR_API_KEY }}
          PYTHONPATH: scripts
        run: python -m company_accounts.probe > source-contract.json
      - uses: actions/upload-artifact@v4
        with:
          name: company-data-source-contract
          path: source-contract.json
          retention-days: 30

      - name: Testa bokslut och fördelning
        run: python -m unittest discover -s tests -p test_company_accounts.py
      - uses: r-lib/actions/setup-r@v2
      - name: Testa befintlig AFR-publicering
        run: |
          Rscript tests/test_afr_publication.R
          Rscript -e "invisible(parse(file='R/etl/afr_sync.R')); invisible(parse(file='R/etl/afr_client.R'))"

  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p test_company_accounts.py
