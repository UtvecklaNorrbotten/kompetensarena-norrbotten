name: ETL - AF månadskontroll

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Körläge"
        required: true
        default: "check"
        type: choice
        options:
          - check
          - validate
          - validate-strict
  schedule:
    # 23:e är startdag för kontroll, inte ett garanterat publiceringsdatum.
    # 1-7 täcker sena publiceringar som annars skulle falla mellan månadsskiften.
    - cron: "15 4 23-31 * *"
    - cron: "15 4 1-7 * *"

permissions:
  contents: read

concurrency:
  group: etl-af-monthly-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checka ut repo
        uses: actions/checkout@v5

      - name: Installera R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Installera beroenden
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::jsonlite
            any::xml2
            any::XML
            any::digest
            any::readxl
            any::dplyr
            any::tidyr
          install-pandoc: false
          install-quarto: false

      - name: Kontrollera AF:s månadsfiler
        if: github.event_name == 'schedule' || inputs.mode == 'check'
        env:
          ETL_BASE_URL: ${{ secrets.ETL_BASE_URL }}
          ETL_PUBLISH_KEY: ${{ secrets.ETL_PUBLISH_KEY }}
        shell: Rscript {0}
        run: |
          source("R/etl/check_af_sources.R")

      - name: Full validering av AF-normalisering
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'validate' || inputs.mode == 'validate-strict')
        env:
          AF_VALIDATION_STRICT: ${{ inputs.mode == 'validate-strict' }}
          AF_VALIDATION_REPORT_DIR: artifacts/af-validation
        shell: Rscript {0}
        run: |
          source("R/etl/validate_af_normalization.R")

      - name: Ladda upp AF-valideringsrapport
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.mode == 'validate' || inputs.mode == 'validate-strict')
        uses: actions/upload-artifact@v4
        with:
          name: af-validation-report-${{ github.run_number }}
          path: artifacts/af-validation
          if-no-files-found: warn
          retention-days: 30
