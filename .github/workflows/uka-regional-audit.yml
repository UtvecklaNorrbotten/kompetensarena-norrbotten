name: 11 · Kontroll · UKÄ – regionala tabellbilagor

on:
  workflow_dispatch:
  schedule:
    - cron: "45 5 * * 1"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installera beroenden
        run: python -m pip install requests beautifulsoup4 openpyxl
      - name: Inventera UKÄ:s tabellbilagor
        run: python scripts/uka_regional_audit.py
      - name: Spara kontrollresultat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uka-regional-kallkontroll
          path: output/uka_regional_audit/
          retention-days: 30
