name: 90 · Test · AFR – återupptagning av publicering
on:
  pull_request:
    paths:
      - R/etl/afr_*.R
      - tests/test_afr_publication.R
      - .github/workflows/validate-afr-publication.yml
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript tests/test_afr_publication.R
      - name: Syntaxkontroll
        run: Rscript -e 'parse(file="R/etl/afr_sync.R"); parse(file="R/etl/afr_publication.R")'
