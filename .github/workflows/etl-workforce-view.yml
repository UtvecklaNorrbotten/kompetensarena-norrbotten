name: 10 · Data · SCB arbetskraft – BAS, RMI och yrkesregistret
on:
  push:
    branches: [feature/arbetsmarknad-arbetskraft]
    paths:
      - scripts/fetch_workforce.py
      - scripts/check_workforce_browser.cjs
      - src/components/labour-market/Workforce*.tsx
      - src/components/geography/MunicipalityMap.tsx
      - .github/workflows/etl-workforce-view.yml
  workflow_dispatch:
    inputs:
      force:
        description: Hämta om samtliga underlag
        type: boolean
        default: false
  schedule:
    - cron: "45 9 * * *"
permissions:
  contents: write
concurrency:
  group: workforce-snapshot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          # A queued bootstrap must include a prior run's data commit.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/cache/restore@v4
        with:
          path: .cache/workforce
          key: workforce-${{ hashFiles('scripts/fetch_workforce.py') }}-${{ github.run_id }}
          restore-keys: |
            workforce-${{ hashFiles('scripts/fetch_workforce.py') }}-
            workforce-
      - name: Hämta och verifiera offentliga SCB-aggregat
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = 'true' ]; then
            python scripts/fetch_workforce.py --force
          else
            python scripts/fetch_workforce.py
          fi
      - name: Verifiera läsmodell, täckning och kontrollsummor
        run: |
          python -m unittest discover -s tests -p 'test_workforce.py' -v
          python scripts/verify_workforce.py
      - uses: actions/setup-node@v5
        if: github.event_name == 'push'
        with:
          node-version: "24"
      - name: Kontrollera gränssnittet inför publicering
        if: github.event_name == 'push'
        run: |
          npm install --no-audit --no-fund --package-lock=false
          node --experimental-strip-types tests/workforce.test.ts
          npx tsc --noEmit
          npm run build
      - name: Kontrollera filter, diagram, mobilvy och export i webbläsare
        if: github.event_name == 'push'
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.cache/browser/node_modules/playwright
        run: |
          npm install --prefix .cache/browser --no-audit --no-fund --package-lock=false playwright@1.62.1
          node .cache/browser/node_modules/playwright/cli.js install --with-deps chromium
          npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/workforce-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/omraden/arbetsmarknad/arbetskraft > /dev/null; then break; fi
            sleep 2
          done
          node scripts/check_workforce_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: workforce-browser
          path: /tmp/workforce-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Publicera verifierad version
        run: |
          if [ -n "$(git status --porcelain src/data/workforce public/data/workforce)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/data/workforce public/data/workforce
            git commit -m 'data: uppdatera SCB arbetskraft'
            git fetch origin "$GITHUB_REF_NAME"
            git merge --no-edit "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/workforce
          key: workforce-${{ hashFiles('scripts/fetch_workforce.py') }}-${{ github.run_id }}
