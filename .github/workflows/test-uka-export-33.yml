name: Test UKA export 33 filters

on:
  push:
    branches:
      - "test/uka-api-inventory"
    paths:
      - ".github/workflows/test-uka-export-33.yml"
      - "scripts/test_uka_export_33.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_uka_export_33.py
