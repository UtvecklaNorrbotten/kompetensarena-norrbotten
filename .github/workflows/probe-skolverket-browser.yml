name: 11b · Data · Skolverket – browser probe

on:
  push:
    branches:
      - test-skolverket-data
    paths:
      - "scripts/skolverket_browser_probe.py"
      - ".github/workflows/probe-skolverket-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checka ut repo
        uses: actions/checkout@v5

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Läs renderade statistikfiler
        run: python scripts/skolverket_browser_probe.py

      - name: Ladda upp resultat
        uses: actions/upload-artifact@v4
        with:
          name: skolverket-browser-probe
          path: artifacts/skolverket_browser_probe/
          if-no-files-found: error
