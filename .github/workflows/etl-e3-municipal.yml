name: 10 · Data · SCB E3 – matchning, kommuner (TAB6929)

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Litet prov utan publicering"
        type: boolean
        default: false
      finalize_test:
        description: "Publicera endast på separat admin-testindikator"
        type: boolean
        default: false
      force_refresh:
        description: "Hämta även om SCB:s metadata är oförändrad"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - R/etl/e3_municipal.R
      - .github/workflows/etl-e3-municipal.yml
  schedule:
    # En kontroll per dygn; förseningar i GitHub får inte hoppa över metadata.
    # 05:30 vintertid / 06:30 sommartid.
    - cron: "30 4 * * *"

permissions:
  contents: read

concurrency:
  group: etl-e3-municipal
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::httr2
            any::jsonlite
            any::purrr
            any::tibble
            any::remotes
            any::digest
          install-pandoc: false
          install-quarto: false
      - name: Installera pxweb2r
        env:
          GITHUB_PAT: ${{ github.token }}
        shell: Rscript {0}
        run: remotes::install_github("FaluPeppe/pxweb2r", upgrade = "never")
      - name: Regressionstest
        shell: Rscript {0}
        run: source("R/etl/validate_e3_municipal.R")
      - name: Vänta på driftsatt backend och migration 0031
        env:
          ETL_BASE_URL: ${{ secrets.ETL_BASE_URL }}
          ETL_PUBLISH_KEY: ${{ secrets.ETL_PUBLISH_KEY }}
        shell: Rscript {0}
        run: |
          source("R/etl/etl_api.R")
          ready <- FALSE
          for (attempt in seq_len(20L)) {
            ready <- tryCatch({
              etl_get_state("e3-matchning-utbildning-kommun")
              etl_get_resumable_history_batch(
                "e3-matchning-utbildning-kommun", paste(rep("0", 64), collapse = "")
              )
              TRUE
            }, error = function(e) {
              message("Backend inte redo: ", conditionMessage(e))
              FALSE
            })
            if (ready) break
            Sys.sleep(30)
          }
          if (!ready) stop("Driftsätt backend och migration 0031 via Lovable och kör om workflowet.")
      - name: Hämta och återuppta E3 kommun
        env:
          ETL_BASE_URL: ${{ secrets.ETL_BASE_URL }}
          ETL_PUBLISH_KEY: ${{ secrets.ETL_PUBLISH_KEY }}
          ETL_INDICATOR: e3_kommun
          ETL_TEST_MODE: ${{ inputs.test_mode || 'false' }}
          ETL_TEST_FINALIZE: ${{ inputs.finalize_test || 'false' }}
          ETL_FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
          ETL_RUN_BUDGET_SECONDS: "14400"
        shell: Rscript {0}
        run: |
          Sys.unsetenv("ETL_E3_FUNCTIONS_ONLY")
          source("R/etl/run_scb.R")
