name: 10 · Data · SCB AFR – företagsregister

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Körläge"
        required: true
        default: "count-only"
        type: choice
        options:
          - count-only
          - initial-load
          - daily
          - cleanup-initial
      confirm_large_removal:
        description: "Godkänn ovanligt stort bortfall (endast efter manuell kontroll)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - R/etl/afr_*.R
      - .github/workflows/etl-scb-afr-daily.yml
  schedule:
    # 04:00 UTC = 05:00 svensk vintertid / 06:00 sommartid, efter SCB:s nattliga underhåll.
    - cron: "0 4 * * *"
    # 08:15 svensk tid. Bara ett av UTC-schemana är aktivt per datum.
    - cron: "15 6 * * *"
    - cron: "15 7 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: etl-scb-afr
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v5

      - name: Avgör om reservkontroll behövs
        id: recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/afr_recovery_gate.py

      - name: Testa reservkontrollens tidslogik
        if: steps.recovery.outputs.should_run == 'true'
        run: python3 -m unittest discover -s tests -p test_afr_recovery_gate.py

      - name: Installera R
        if: steps.recovery.outputs.should_run == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Testa återupptagning av publicering
        if: steps.recovery.outputs.should_run == 'true'
        run: Rscript tests/test_afr_publication.R

      - name: Installera beroenden
        if: steps.recovery.outputs.should_run == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::jsonlite
            any::openssl
          install-pandoc: false
          install-quarto: false

      - name: Kör AFR-synk
        if: steps.recovery.outputs.should_run == 'true'
        env:
          AFR_PROFILE_CACHE: /tmp/afr-profile-pages
          AFR_MODE: ${{ github.event_name != 'workflow_dispatch' && 'daily' || inputs.mode }}
          AFR_CONFIRM_LARGE_REMOVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_large_removal || 'false' }}
          SCB_AFR_API_KEY: ${{ secrets.SCB_AFR_API_KEY }}
          ETL_BASE_URL: ${{ secrets.ETL_BASE_URL }}
          ETL_PUBLISH_KEY: ${{ secrets.ETL_PUBLISH_KEY }}
        shell: Rscript {0}
        run: |
          source("R/etl/afr_sync.R")

      - name: Komplettera skyddad namn- och adresshistorik
        if: steps.recovery.outputs.should_run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'daily' || inputs.mode == 'initial-load')
        env:
          AFR_PROFILE_CACHE: /tmp/afr-profile-pages
          SCB_AFR_API_KEY: ${{ secrets.SCB_AFR_API_KEY }}
          ETL_BASE_URL: ${{ secrets.ETL_BASE_URL }}
          ETL_PUBLISH_KEY: ${{ secrets.ETL_PUBLISH_KEY }}
          PYTHONPATH: scripts
        run: python3 -m company_accounts.profiles
