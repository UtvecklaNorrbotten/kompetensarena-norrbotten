name: ETL - SCB Allmänna företagsregistret (AFR)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Körläge"
        required: true
        default: "count-only"
        type: choice
        options:
          - count-only
          - initial-load
          - daily
          - cleanup-initial
      confirm_large_removal:
        description: "Godkänn ovanligt stort bortfall (endast efter manuell kontroll)"
        required: false
        default: false
        type: boolean
  schedule:
    # 04:00 UTC = 05:00 svensk vintertid / 06:00 sommartid, efter SCB:s nattliga underhåll.
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  group: etl-scb-afr
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v5

      - name: Installera R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Installera beroenden
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::jsonlite
            any::openssl
          install-pandoc: false
          install-quarto: false

      - name: Kör AFR-synk
        env:
          AFR_MODE: ${{ github.event_name == 'schedule' && 'daily' || inputs.mode }}
          AFR_CONFIRM_LARGE_REMOVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_large_removal || 'false' }}
          SCB_AFR_API_KEY: ${{ secrets.SCB_AFR_API_KEY }}
          ETL_BASE_URL: ${{ secrets.ETL_BASE_URL }}
          ETL_PUBLISH_KEY: ${{ secrets.ETL_PUBLISH_KEY }}
        shell: Rscript {0}
        run: |
          source("R/etl/afr_sync.R")
