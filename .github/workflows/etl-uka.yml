name: 10 · Data · UKÄ – högskolan i siffror

run-name: >-
  UKÄ ETL – ${{ github.event.inputs.indicator || 'alla' }} –
  ${{ github.event_name == 'schedule' && 'schemalagd' || 'manuell' }}

on:
  workflow_dispatch:
    inputs:
      indicator:
        description: "UKÄ-indikator (ID eller all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - "13"
          - "31"
          - "33"
          - "97"
          - "99"
          - "108"
          - "136"
      test_mode:
        description: "Hämta och validera utan publicering"
        required: false
        type: boolean
        default: false
  schedule:
    # UKÄ publicerar på olika datum. Veckokontroll räcker och snapshoten
    # gör automatiskt att bara de senaste fem åren behålls.
    - cron: "30 4 * * 1"

permissions:
  contents: read

concurrency:
  group: etl-uka
  cancel-in-progress: false

jobs:
  uka:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checka ut repo
        uses: actions/checkout@v5

      - name: Installera R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Installera beroenden
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::httr2
            any::jsonlite
            any::purrr
            any::readr
            any::stringr
            any::tibble
          install-pandoc: false
          install-quarto: false

      - name: Hämta och publicera UKÄ
        env:
          ETL_BASE_URL: ${{ secrets.ETL_BASE_URL }}
          ETL_PUBLISH_KEY: ${{ secrets.ETL_PUBLISH_KEY }}
          UKA_INDICATOR: ${{ github.event_name == 'workflow_dispatch' && inputs.indicator || 'all' }}
          ETL_TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
        shell: Rscript {0}
        run: |
          source("R/etl/uka_sync.R")
