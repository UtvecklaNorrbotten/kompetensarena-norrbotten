name: 10 · Data · UKÄ – högskolan i siffror

run-name: >-
  UKÄ ETL – ${{ github.event.inputs.indicator || 'alla' }} –
  ${{ github.event_name == 'schedule' && 'schemalagd' || github.event_name == 'push' && 'importändring' || 'manuell' }}

on:
  push:
    branches: [main]
    paths:
      - "R/etl/uka_sync.R"
      - "R/etl/uka_values.R"
      - "tests/uka-values.R"
      - "tests/uka-api.R"
      - "scripts/uka_files_sync.py"
      - "tests/test_uka_files.py"
      - "config/uka_regional_sources.json"
      - ".github/workflows/etl-uka.yml"
  workflow_dispatch:
    inputs:
      indicator:
        description: "UKÄ-indikator (ID eller all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - "13"
          - "31"
          - "33"
          - "97"
          - "99"
          - "108"
          - "136"
          - "77"
          - "134"
          - "135"
          - api
          - files
          - extended
      test_mode:
        description: "Hämta och validera utan publicering"
        required: false
        type: boolean
        default: false
  schedule:
    # Veckovis API-hämtning; filkällor kontrolleras före export, full revision kvartalsvis.
    # De sju ursprungliga indikatorernas femårsregel behålls.
    - cron: "30 4 * * 1"

permissions:
  contents: read

concurrency:
  group: etl-uka
  cancel-in-progress: false

jobs:
  files:
    # Sekventiella jobb undviker samtidiga fulla UKÄ-aggregatomräkningar.
    needs: api
    if: >-
      always() && (github.event_name != 'workflow_dispatch' ||
      inputs.indicator == 'all' || inputs.indicator == 'files' || inputs.indicator == 'extended')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installera UKÄ-beroenden
        run: |
          python -m pip install requests beautifulsoup4 openpyxl pdfplumber
          command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Testa struktur, dimensioner och publiceringsregler
        run: python -m unittest discover -s tests -p 'test_uka_files.py' -v
      - name: Hämta och publicera Excel och PDF
        env:
          ETL_BASE_URL: ${{ secrets.ETL_BASE_URL }}
          ETL_PUBLISH_KEY: ${{ secrets.ETL_PUBLISH_KEY }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
          VERIFY_NO_CHANGE: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          if [ "$TEST_MODE" = true ]; then
            python -u scripts/uka_files_sync.py
          else
            python -u scripts/uka_files_sync.py --publish
            if [ "$VERIFY_NO_CHANGE" = true ]; then
              cp output/uka_extended/summary.json output/uka_extended/publication.json
              python -u scripts/uka_files_sync.py --publish --expect-no-change
              cp output/uka_extended/summary.json output/uka_extended/no-change.json
              cp output/uka_extended/publication.json output/uka_extended/summary.json
            fi
          fi
      - name: Spara källor, kontroller och importerade radantal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uka-genomstromning-regional
          path: output/uka_extended/*.json
          retention-days: 90

  api:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.indicator != 'files' && inputs.indicator != 'extended')
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checka ut repo
        uses: actions/checkout@v5

      - name: Installera R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Installera beroenden
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::httr2
            any::jsonlite
            any::purrr
            any::readr
            any::stringr
            any::tibble
          install-pandoc: false
          install-quarto: false

      - name: Testa gemensam API-import, ålder och totaler
        shell: Rscript {0}
        run: |
          source("tests/uka-values.R")
          source("tests/uka-api.R")

      - name: Hämta och publicera alla valda API-indikatorer
        env:
          ETL_BASE_URL: ${{ secrets.ETL_BASE_URL }}
          ETL_PUBLISH_KEY: ${{ secrets.ETL_PUBLISH_KEY }}
          UKA_INDICATOR: ${{ github.event_name == 'workflow_dispatch' && inputs.indicator || 'all' }}
          ETL_TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
        shell: Rscript {0}
        run: |
          source("R/etl/uka_sync.R")

