name: Test UKA indicator names

on:
  push:
    branches:
      - "test/uka-api-inventory"
    paths:
      - ".github/workflows/test-uka-indicator-names.yml"
      - "scripts/test_uka_indicator_names.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_uka_indicator_names.py
