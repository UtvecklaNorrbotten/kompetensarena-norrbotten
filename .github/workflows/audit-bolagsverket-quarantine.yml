name: 90 · Kontroll · Bolagsverket – karantän mot API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/company_accounts/audit_quarantine.py
      - .github/workflows/audit-bolagsverket-quarantine.yml
permissions:
  contents: read
concurrency:
  group: audit-bolagsverket-quarantine
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Testa diagnoser och API-klient
        run: |
          python -m unittest discover -s tests -p test_bolagsverket_api.py
          python -m unittest discover -s tests -p test_quarantine_audit.py
      - name: Jämför sparade karantänpaket med produktions-API
        env:
          BOLAGSVERKET_CLIENT_ID: ${{ secrets.BOLAGSVERKET_CLIENT_ID }}
          BOLAGSVERKET_CLIENT_SECRET: ${{ secrets.BOLAGSVERKET_CLIENT_SECRET }}
          ETL_BASE_URL: ${{ secrets.ETL_BASE_URL }}
          ETL_PUBLISH_KEY: ${{ secrets.ETL_PUBLISH_KEY }}
          PYTHONPATH: scripts
        run: python -m company_accounts.audit_quarantine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-quarantine-audit
          path: company-quarantine-audit.json
          retention-days: 30
