name: "Probe · Skolverket SUSA komvux (engångskontroll)"
on:
  push:
    paths: [".github/workflows/probe-susa-komvux.yml"]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect filtered records, provider relations, and geography
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,collections
          base="https://api.skolverket.se/susa-navet/emil3"
          for code in ["VUXGY","VUXGR","VUXSFI"]:
            r=requests.get(base+"/educationEvents",params={"schoolType":code,"page":0,"size":5},timeout=45);print("CODE",code,r.status_code)
            j=r.json()
            for x in j.get("educationEvents",[])[:5]:print("EVENT",json.dumps(x,ensure_ascii=False)[:4000])
            for pid in set(p for x in j.get("educationEvents",[]) for p in x.get("content",{}).get("providers",[])):
              rr=requests.get(base+"/educationProviders/"+pid,timeout=30);print("PROVIDER",pid,rr.status_code,rr.text[:2000])
          r=requests.get(base+"/educationProviders",params={"schoolType":"VUXGY","page":0,"size":1000},timeout=60)
          print("PROVIDERS",r.status_code,"PAGES",r.json().get("page"))
          j=r.json()
          matches=[]
          for x in j.get("educationProviders",[]):
            content=x.get("content") or {}
            blob=json.dumps(content,ensure_ascii=False)
            if any(t in blob.lower() for t in ["luleå","boden","piteå","kiruna","kalix","gällivare","haparanda","pajala","jokkmokk","överkalix","övertorneå","arjeplog","arvidsjaur","älvsbyn"]):
              matches.append(x)
          print("PROVIDER_NORRBOTTEN_FIRST_PAGE",json.dumps(matches,ensure_ascii=False)[:18000])
          PY
