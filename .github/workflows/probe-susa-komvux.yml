name: "Probe · SUSA alla skolformer Norrbotten"
on:
  push:
    paths: [".github/workflows/probe-susa-komvux.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download prior complete SUSA results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p susa-all
          python - <<'PY'
          import os,requests,io,zipfile
          api="https://api.github.com/repos/UtvecklaNorrbotten/kompetensarena-norrbotten/actions/artifacts/124"
          r=requests.get("https://api.github.com/repos/UtvecklaNorrbotten/kompetensarena-norrbotten/actions/runs/39936499388/artifacts",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"},timeout=40)
          r.raise_for_status()
          artifacts=r.json()["artifacts"]
          print("ARTIFACTS",[(x["id"],x["name"]) for x in artifacts])
          art=next(x for x in artifacts if x["name"]=="susa-all-schooltypes-norrbotten")
          q=requests.get(art["archive_download_url"],headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"]},timeout=60)
          q.raise_for_status()
          z=zipfile.ZipFile(io.BytesIO(q.content)); print("FILES",z.namelist());z.extractall("susa-all")
          PY
      - name: Classify matched events by official education information
        run: |
          cat > /tmp/classify.py <<'PY'
          import requests,concurrent.futures,collections,json,time,datetime,pathlib,sys
          out=pathlib.Path("susa-all")
          events=json.loads((out/"norrbotten_events.json").read_text())
          ids=sorted(set(x["educationId"] for x in events if x["educationId"]))
          missing=[x for x in events if not x["educationId"]]
          print("UNIQUE EDUCATION IDS",len(ids),"NO EDUCATION",len(missing),flush=True)
          root="https://api.skolverket.se/susa-navet/emil3/educationInfos/"
          def get(eid):
            for attempt in range(4):
              try:
                r=requests.get(root+requests.utils.quote(eid,safe=""),timeout=45,headers={"User-Agent":"Kompetensarena-Norrbotten research"})
                r.raise_for_status()
                j=r.json()
                return eid,j
              except Exception as e:
                if attempt==3:return eid,{"error":str(e)}
                time.sleep(1+attempt)
          fetched={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
            for i,pair in enumerate(pool.map(get,ids),1):
              fetched[pair[0]]=pair[1]
              if i%300==0:print("FETCHED",i,len(ids),flush=True)
          report=json.loads((out/"summary.json").read_text())
          errs={k:v["error"] for k,v in fetched.items() if "error" in v}
          print("EDUCATION_ERRORS",len(errs),flush=True)
          schooltype_by_id={}
          for eid,d in fetched.items():
            c=d.get("content") or {}
            schooltype_by_id[eid]=(c.get("type") or {}).get("code","UNSPECIFIED")
          report["schoolForms"]={}
          for municipality,row in report["municipalities"].items():
            sub=[x for x in events if x["municipality"]==municipality]
            count=collections.Counter(schooltype_by_id.get(x["educationId"],"UNKNOWN") for x in sub)
            unique={t:len(set(x["educationId"] for x in sub if schooltype_by_id.get(x["educationId"],"UNKNOWN")==t)) for t in count}
            row["schoolForms"]={k:{"events":v,"uniqueEducations":unique[k]} for k,v in sorted(count.items())}
            report["schoolForms"][municipality]=row["schoolForms"]
          report["educationErrors"]=errs
          (out/"education_info_norrbotten.json").write_text(json.dumps(fetched,ensure_ascii=False,indent=2),encoding="utf8")
          (out/"schoolform_coverage.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf8")
          print("SCHOOLFORM_SUMMARY",json.dumps(report["schoolForms"],ensure_ascii=False),flush=True)
          if errs:sys.exit(1)
          PY
          python /tmp/classify.py
      - name: Upload classified results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: susa-norrbotten-schoolforms
          path: susa-all/
          if-no-files-found: error
