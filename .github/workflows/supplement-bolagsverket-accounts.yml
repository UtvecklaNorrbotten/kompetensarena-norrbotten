name: 10 · Data · Bolagsverket – kompletteringar och reservationer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/company_accounts/supplement_accounts.py
      - .github/workflows/supplement-bolagsverket-accounts.yml
  schedule:
    # At most 1,000 companies per run; private per-company checkpoints.
    - cron: '45 */4 * * *'
permissions:
  contents: read
concurrency:
  group: supplement-bolagsverket-accounts
  cancel-in-progress: false
jobs:
  supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Testa reserverad tolkning och källhantering
        run: python -m unittest discover -s tests -p test_company_supplements.py
      - name: Spara reserverade uppgifter och hämta saknade API-rapporter
        env:
          ETL_BASE_URL: ${{ secrets.ETL_BASE_URL }}
          ETL_PUBLISH_KEY: ${{ secrets.ETL_PUBLISH_KEY }}
          BOLAGSVERKET_CLIENT_ID: ${{ secrets.BOLAGSVERKET_CLIENT_ID }}
          BOLAGSVERKET_CLIENT_SECRET: ${{ secrets.BOLAGSVERKET_CLIENT_SECRET }}
          PYTHONPATH: scripts
        run: python -m company_accounts.supplement_accounts --api-limit 1000
