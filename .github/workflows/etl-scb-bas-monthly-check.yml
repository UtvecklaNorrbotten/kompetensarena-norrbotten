name: 10 · Data · BAS – månadsuppdatering

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Kontroll, full historik eller prov utan databasåtkomst"
        type: choice
        default: check
        options: [check, full, validate]
  schedule:
    # Startfönster den 22:a. Skriptet fortsätter dagligen över månadsskiftet
    # tills förväntad period faktiskt har publicerats hos oss.
    # Utanför fönstret läses bara vårt eget tillstånd, inte SCB-data.
    - cron: "45 8 * * *"

permissions:
  contents: read

# Samma lås som kvartalsimporten: de får inte publicera parallellt.
concurrency:
  group: etl-scb-bas
  cancel-in-progress: false

jobs:
  bas:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testa kontrollfönster, återstart och SCB-format
        run: python -m unittest discover -s tests -p 'test_bas_etl.py' -v
      - name: Kontrollera metadata och hämta nya BAS-perioder
        env:
          ETL_BASE_URL: ${{ secrets.ETL_BASE_URL }}
          ETL_PUBLISH_KEY: ${{ secrets.ETL_PUBLISH_KEY }}
          BAS_MODE: ${{ inputs.mode || 'check' }}
          BAS_SCHEDULED: ${{ github.event_name == 'schedule' }}
          BAS_RUN_BUDGET_SECONDS: "14400"
        run: |
          args=(--mode "$BAS_MODE")
          if [ "$BAS_SCHEDULED" = "true" ]; then args+=(--scheduled); fi
          python scripts/etl_scb_bas.py "${args[@]}"
      - name: Spara BAS-kontrollrapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bas-monthly-${{ github.run_number }}
          path: artifacts/bas
          if-no-files-found: warn
          retention-days: 90
