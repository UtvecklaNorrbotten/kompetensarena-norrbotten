name: 99 · Underhåll · återkör BAS och AF 2026-10-29
on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-data-20261029.yml]
permissions:
  actions: write
  contents: read
jobs:
  recover:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Återkör BAS, AF-månad och AF-historik i ordning
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          run_and_wait() {
            local workflow="$1"
            shift
            gh workflow run "$workflow" --ref main "$@"
            local run_id=""
            for attempt in {1..12}; do
              run_id=$(gh run list --workflow "$workflow" --event workflow_dispatch --branch main --limit 10 --json databaseId,headSha --jq 'map(select(.headSha == env.GITHUB_SHA))[0].databaseId')
              if [[ -n "$run_id" && "$run_id" != "null" ]]; then break; fi
              sleep 5
            done
            if [[ -z "$run_id" || "$run_id" == "null" ]]; then
              echo "Kunde inte hitta körningen för $workflow" >&2
              return 1
            fi
            echo "$workflow: https://github.com/$GH_REPO/actions/runs/$run_id" | tee -a "$GITHUB_STEP_SUMMARY"
            gh run watch "$run_id" --exit-status --interval 30
          }
          result=0
          run_and_wait etl-scb-bas-monthly-check.yml -f mode=check || result=1
          run_and_wait etl-af-monthly-check.yml -f mode=publish-current || result=1
          run_and_wait etl-af-quarterly-revisions.yml -f mode=check -f target=sok || result=1
          exit "$result"
