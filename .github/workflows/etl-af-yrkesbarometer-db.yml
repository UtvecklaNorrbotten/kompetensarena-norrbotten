name: 10 · Data · AF – Yrkesbarometern (databas)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Körläge"
        required: true
        default: "check"
        type: choice
        options:
          - check
          - validate
          - publish
  schedule:
    # Kontrollera varje måndag juni/december; periodisk hämtning är idempotent.
    - cron: "45 5 * 6,12 1"

permissions:
  contents: read

concurrency:
  group: etl-af-yrkesbarometern-db
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Syntaxkontroll
        run: python -m compileall -q scripts/etl_af_yrkesbarometer_publish.py
      - name: Validera eller publicera Yrkesbarometern
        env:
          ETL_BASE_URL: ${{ secrets.ETL_BASE_URL }}
          ETL_PUBLISH_KEY: ${{ secrets.ETL_PUBLISH_KEY }}
          YB_MODE: ${{ github.event_name == 'schedule' && 'check' || inputs.mode }}
        run: python scripts/etl_af_yrkesbarometer_publish.py --mode "$YB_MODE"
      - name: Spara valideringsrapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af-yrkesbarometer-import-${{ github.run_number }}
          path: artifacts/af-yrkesbarometer-import-report.json
          if-no-files-found: warn
          retention-days: 90
