name: 00 · Kontroll · AF – Yrkesbarometern

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kontrollera aktuell yrkesbarometer
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, collections, pathlib
          url = "https://data.arbetsformedlingen.se/prognoser/yrkesbarometer.json"
          req = urllib.request.Request(url, headers={"User-Agent": "Kompetensarena-Norrbotten-source-validation/1.0"})
          with urllib.request.urlopen(req, timeout=90) as response:
              payload = response.read()
          data = json.loads(payload)
          print("HTTP JSON bytes:", len(payload), "root type:", type(data).__name__)
          if isinstance(data, dict):
              print("Root keys:", sorted(data))
              rows = next((v for v in data.values() if isinstance(v, list) and v and isinstance(v[0], dict)), None)
          else:
              rows = data
          if not isinstance(rows, list) or not rows or not isinstance(rows[0], dict):
              raise RuntimeError("Okänd JSON-struktur; stoppa innan ETL byggs")
          keys = sorted(set().union(*(r.keys() for r in rows)))
          print("Number of rows:", len(rows))
          print("Keys:", keys)
          required = {"lan", "yb_concept_id", "omgang", "jobbmojligheter", "rekryteringssituation", "prognos"}
          missing = required - set(keys)
          if missing: raise RuntimeError("Saknade nödvändiga fält: " + repr(sorted(missing)))
          print("Versions:", dict(collections.Counter(str(r.get("omgang")) for r in rows)))
          print("Regions:", dict(sorted(collections.Counter(str(r.get("lan")) for r in rows).items())))
          norrbotten = [r for r in rows if str(r.get("lan")) == "25"]
          rik = [r for r in rows if str(r.get("lan")) == "00"]
          print("Norrbotten entries:", len(norrbotten), "National entries:", len(rik))
          if not norrbotten: raise RuntimeError("Inga rader för Norrbotten (25)")
          for key in ("jobbmojligheter", "rekryteringssituation", "prognos", "hogsta_bedomningsniva", "delvis_helt"):
              print("Norrbotten " + key + ":", dict(collections.Counter(str(r.get(key)) for r in norrbotten)))
          print("Norrbotten distinct occupations:", len({r.get("yb_concept_id") for r in norrbotten}))
          print("SSYK mapping examples:", [(r.get("yb_yrke"), r.get("ssyk"), r.get("antal_ssyk"), r.get("del_av_ssyk")) for r in norrbotten[:6]])
          summary = {
              "source": url, "bytes": len(payload), "rows": len(rows),
              "columns": keys, "omgang": dict(collections.Counter(str(r.get("omgang")) for r in rows)),
              "lan_counts": dict(collections.Counter(str(r.get("lan")) for r in rows)),
              "norrbotten_rows": len(norrbotten),
              "norrbotten_distinct_occupations": len({r.get("yb_concept_id") for r in norrbotten}),
              "norrbotten_geographic_basis": dict(collections.Counter(str(r.get("hogsta_bedomningsniva")) + "/" + str(r.get("delvis_helt")) for r in norrbotten)),
          }
          pathlib.Path("yrkesbarometer-probe.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Publicera kontrollrapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af-yrkesbarometer-probe
          path: yrkesbarometer-probe.json
          if-no-files-found: warn
          retention-days: 30
