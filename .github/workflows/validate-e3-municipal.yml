name: Validate E3 municipal
on:
  pull_request:
    paths:
      - R/etl/**
      - src/lib/etl-batch.server.ts
      - drizzle/migrations/0031_e3_municipal_snapshot.sql
      - drizzle/migrations/0032_e3_municipal_aggregates.sql
      - tests/e3-snapshot-*.sql
      - .github/workflows/validate-e3-municipal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: e3_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verifiera SQL-återstart och behörigheter i isolerad testdatabas
        env:
          PGPASSWORD: test-only
        run: |
          psql -h localhost -U postgres -d e3_test -v ON_ERROR_STOP=1 \
            -f tests/e3-snapshot-fixture.sql \
            -f drizzle/migrations/0031_e3_municipal_snapshot.sql \
            -f tests/e3-snapshot-checks.sql
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Kontrollera R-syntax och syntetiska regressionsexempel
        shell: Rscript {0}
        run: |
          files <- list.files("R/etl", pattern = "\\.R$", full.names = TRUE)
          invisible(lapply(files, parse))
          source("R/etl/validate_e3_municipal.R")
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::httr2
            any::jsonlite
            any::purrr
            any::tibble
            any::remotes
            any::digest
          install-pandoc: false
          install-quarto: false
      - name: Installera pxweb2r
        env:
          GITHUB_PAT: ${{ github.token }}
        shell: Rscript {0}
        run: remotes::install_github("FaluPeppe/pxweb2r", upgrade = "never")
      - name: Verifiera faktiskt SCB-prov utan databasåtkomst
        env:
          ETL_DRY_RUN: "true"
          ETL_TEST_MODE: "true"
        shell: Rscript {0}
        run: |
          Sys.unsetenv("ETL_E3_FUNCTIONS_ONLY")
          source("R/etl/e3_municipal.R")
