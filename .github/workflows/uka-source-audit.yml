name: 90 · Diagnostik · UKÄ – källobservationer

on:
  pull_request:
    paths:
      - scripts/uka_source_audit.py
      - tests/test_uka_source_audit.py
      - .github/workflows/uka-source-audit.yml
  workflow_dispatch:
    inputs:
      resume_run:
        description: "Återanvänd verifierade källfiler från detta diagnostikkörnings-ID (valfritt)"
        type: string
        default: ""
      snapshot:
        description: "Samma snapshot-ID som återstartens körning; tomt = dagens UTC-datum"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: uka-source-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - run: python -m unittest discover -s tests -p test_uka_source_audit.py -v

  r_control:
    if: github.event_name == 'workflow_dispatch'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::httr2
            any::jsonlite
            any::purrr
            any::readr
            any::stringr
            any::tibble
          install-pandoc: false
          install-quarto: false
      - name: Kontrollera samma minimala export med befintlig R-klient
        shell: Rscript {0}
        run: |
          Sys.setenv(UKA_LOAD_ONLY = "true")
          source("R/etl/uka_sync.R")
          groups <- extract_dynamic_groups(uka_filter_html(33L, "group.php"))
          totals <- unlist(lapply(groups, function(g) paste0(g$index, "dynamic:TOTAL")))
          period <- head(extract_values(uka_filter_html(33L, "academic_term.php?direction=from"), "from:"), 1L)
          result <- uka_export(33L, period, sub("^from:", "to:", period),
                               "uni:1", "gender:Total", "age:1", totals)
          stopifnot(nrow(result) == 1L)
          message("R_CONTROL source total: ", jsonlite::toJSON(result, dataframe = "rows", auto_unbox = TRUE))

  source:
    if: github.event_name == 'workflow_dispatch'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        indicator: [13, 31, 33, 97, 99, 108, 136, 77, 134, 135]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run != ''
        with:
          name: uka-source-${{ matrix.indicator }}
          path: output/uka-source-audit
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
      - name: Jämför verkliga observationer och källtotaler utan publicering
        env:
          INDICATOR: ${{ matrix.indicator }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          args=()
          if [ -n "$SNAPSHOT" ]; then args+=(--snapshot "$SNAPSHOT"); fi
          python -u scripts/uka_source_audit.py --indicator "$INDICATOR" "${args[@]}"
      - name: Spara återstartbara källfiler och kontroller även vid fel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uka-source-${{ matrix.indicator }}
          path: output/uka-source-audit
          retention-days: 14
      - name: Redovisa kontrollstatus
        if: always()
        env:
          INDICATOR: ${{ matrix.indicator }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('output/uka-source-audit') / ('audit-' + os.environ['INDICATOR'] + '.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('### UKÄ ' + os.environ['INDICATOR'] + '\n\n')
              if not path.exists():
                  out.write('Ingen komplett kontrollrapport. Se diagnostikartefakten. Publicering spärrad.\n')
              else:
                  report = json.loads(path.read_text())
                  cases = report['cases']
                  out.write('Minimalt källprov: ' + report.get('control', {}).get('status', 'ej redovisat') + '.\n\n')
                  if report.get('blocked'):
                      out.write(report['blocked'] + '\n\n')
                  out.write(f"Verifierade urval: {sum(c['verified'] for c in cases)}/{len(cases)}.\n\n")
                  out.write('Detta är källtester, ingen produktionsimport.\n')
          PY
