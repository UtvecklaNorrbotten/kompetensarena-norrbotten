name: 10 · Data · SCB E3 – matchning, län och Riket (TAB6929)

run-name: >-
  SCB ETL – ${{ github.event.inputs.indicator || 'e3' }} –
  ${{ github.event_name == 'schedule' && 'schemalagd' || 'manuell' }}

on:
  workflow_dispatch:
    inputs:
      indicator:
        description: "SCB-indikator"
        required: true
        type: choice
        options:
          - e3
        default: e3
      test_mode:
        description: "Testa en liten batch utan att publicera data"
        required: false
        type: boolean
        default: false
      finalize_test:
        description: "Testa versionerad finalisering på separat testindikator"
        required: false
        type: boolean
        default: false
      force_refresh:
        description: "Hämta och publicera även om SCB:s metadata är oförändrad"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/etl-scb-indicators.yml
  schedule:
    # En kontroll per dygn; förseningar i GitHub får inte hoppa över metadata.
    # 05:00 vintertid / 06:00 sommartid.
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  group: etl-scb-${{ github.event.inputs.indicator || 'e3' }}
  cancel-in-progress: false

jobs:
  scb:
    name: SCB-indikator - ${{ github.event.inputs.indicator || 'e3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Installera R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Installera R-beroenden
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::httr2
            any::jsonlite
            any::purrr
            any::tibble
            any::remotes
          install-pandoc: false
          install-quarto: false

      - name: Installera pxweb2r
        env:
          GITHUB_PAT: ${{ github.token }}
        shell: Rscript {0}
        run: |
          remotes::install_github("FaluPeppe/pxweb2r", upgrade = "never")

      - name: Kör vald SCB-indikator
        env:
          ETL_BASE_URL: ${{ secrets.ETL_BASE_URL }}
          ETL_PUBLISH_KEY: ${{ secrets.ETL_PUBLISH_KEY }}
          ETL_INDICATOR: ${{ github.event.inputs.indicator || 'e3' }}
          ETL_TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
          ETL_TEST_FINALIZE: ${{ github.event.inputs.finalize_test || 'false' }}
          ETL_FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
        shell: Rscript {0}
        run: |
          source("R/etl/run_scb.R")
