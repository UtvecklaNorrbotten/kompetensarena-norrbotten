name: 10 · Data · SCB LoR – lediga jobb och rekryteringsbehov
on:
  workflow_dispatch:
    inputs:
      force:
        description: Hämta om hela historiken för revisionskontroll
        type: boolean
        default: false
  schedule:
    - cron: "15 7 * * *"
permissions:
  contents: write
concurrency:
  group: scb-lor
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - name: Kontrollera metadata och bygg verifierade aggregat
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python scripts/fetch_labour_demand.py --source lor --force
          else
            python scripts/fetch_labour_demand.py --source lor
          fi
      - name: Verifiera källor och läsmodell
        run: PYTHONPATH=tests python -m unittest test_labour_demand.DemandTests.test_lor_snapshot
      - name: Publicera atomiskt via Git
        run: |
          if [ -n "$(git status --porcelain src/data/demand/lor.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/data/demand/lor.json
            git commit -m 'data: uppdatera verifierad SCB LoR'
            git push
          fi
