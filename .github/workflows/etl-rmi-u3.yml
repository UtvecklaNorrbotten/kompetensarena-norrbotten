name: 10 · Data · SCB RMI – utbildningsflöden (TAB6928)

on:
  workflow_dispatch:
    inputs:
      force:
        description: Hämta även om källans uppdateringstid är oförändrad
        type: boolean
        default: false
  schedule:
    - cron: "45 6 * * 2"
    - cron: "45 7 2 1,4,7,10 *"

permissions:
  contents: write

concurrency:
  group: rmi-u3-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Kontrollera metadata och hämta verifierade SCB-tabeller
        env:
          FORCE_REFRESH: ${{ inputs.force || github.event.schedule == '45 7 2 1,4,7,10 *' }}
        run: python scripts/fetch_rmi_geography.py
      - name: Kontrollera datakvalitet
        run: python -m unittest discover -s tests -p 'test_rmi_snapshot.py'
      - name: Spara nya offentliga aggregat
        run: |
          if [ -n "$(git status --porcelain src/data/rmi)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/data/rmi
            git commit -m 'data: uppdatera SCB RMI utbildningsflöden'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
