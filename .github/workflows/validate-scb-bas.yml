name: 90 · Test · BAS – import

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/etl_scb_bas.py
      - tests/test_bas_etl.py
      - .github/workflows/*bas*.yml
      - drizzle/migrations/0039_bas_sources_and_indicators.sql
  push:
    branches: [main]
    paths:
      - scripts/etl_scb_bas.py
      - tests/test_bas_etl.py
      - .github/workflows/*bas*.yml
      - drizzle/migrations/0039_bas_sources_and_indicators.sql

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regressionstester
        run: python -m unittest discover -s tests -p 'test_bas_etl.py' -v
      - name: Verkligt SCB-prov för Riket, Norrbotten och Luleå
        run: python scripts/etl_scb_bas.py --mode validate
