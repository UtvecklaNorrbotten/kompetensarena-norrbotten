name: 90 · Test · AF – normalisering

on:
  workflow_dispatch:
  pull_request:
    paths:
      - R/etl/af_normalize.R
      - R/etl/af_pivot_cache.R
      - tests/test_af_pivot_cache.R
      - .github/workflows/validate-af-normalization.yml

permissions:
  contents: read

jobs:
  validate-current:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checka ut repo
        uses: actions/checkout@v5

      - name: Installera R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Installera beroenden
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::jsonlite
            any::xml2
            any::XML
            any::digest
            any::readxl
            any::dplyr
            any::tidyr
          install-pandoc: false
          install-quarto: false

      - name: Testa omnumrerade AF-cacher
        run: Rscript tests/test_af_pivot_cache.R

      - name: Validera aktuell AF-period
        env:
          AF_VALIDATION_HISTORY: "false"
          AF_VALIDATION_REPORT_DIR: artifacts/af-validation-current
        shell: Rscript {0}
        run: |
          source("R/etl/validate_af_normalization.R")

      - name: Ladda upp aktuell valideringsrapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af-validation-current-${{ github.run_number }}
          path: artifacts/af-validation-current
          if-no-files-found: warn
          retention-days: 30

